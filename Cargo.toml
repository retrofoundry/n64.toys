[workspace]
resolver = "2"
members = ["crates/asm", "crates/web", "tools/asm-compat"]

[workspace.dependencies]
n64-gbi = { git = "https://github.com/retrofoundry/fast3d-rs", rev = "696a67d9ecddda65017348faf73714599b23a7a7" }
fast3d = { git = "https://github.com/retrofoundry/fast3d-rs", rev = "696a67d9ecddda65017348faf73714599b23a7a7", default-features = false }
wgpu = "29.0"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
# wasm-bindgen MUST equal the Nix wasm-bindgen-cli version EXACTLY (0.2.108).
# The trio below is the lockstep-consistent set for wasm-bindgen 0.2.108 (matches wgpu 29.0.3).
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = "=0.3.85"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
